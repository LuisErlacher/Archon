name: archon-spec-loop-pi
description: |
  Use when: You want to autonomously process all specs in specs/003-024 sequentially overnight.
  Triggers: "spec loop", "process all specs", "overnight loop", "implement all specs".
  Input: (none required) — reads queue from .archon/loop-state/spec-queue.txt
  Output: One PR per spec, all merged into dev. Final report at end.

  Self-driving loop workflow:
  1. Initializes queue from specs/003-024 if empty
  2. For each spec: implements code, creates branch, commits, pushes, opens PR, merges to dev, pops queue
  3. Continues until queue is empty
  4. Reports done/failed/conflict counts at end

  NOT for: Single spec implementation (use archon-gsd-feature-pi).

provider: pi-ai
model: glm-5.1

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: INIT — Build queue from specs/ if empty
  # ═══════════════════════════════════════════════════════════════

  - id: init-queue
    bash: |
      mkdir -p .archon/loop-state
      QUEUE=.archon/loop-state/spec-queue.txt
      DONE=.archon/loop-state/spec-done.log
      FAILED=.archon/loop-state/spec-failed.log
      CONFLICT=.archon/loop-state/spec-conflict.log
      touch "$DONE" "$FAILED" "$CONFLICT"

      if [[ ! -s "$QUEUE" ]]; then
        echo "Initializing queue from specs/003-024"
        ls specs/00[3-9]*.md specs/01*.md specs/02*.md 2>/dev/null | sort > "$QUEUE"
      fi

      echo "════════════════════════════════════════════════════════════"
      echo "SPEC LOOP STATE"
      echo "════════════════════════════════════════════════════════════"
      echo "Queue size: $(wc -l < "$QUEUE")"
      echo "Already done: $(wc -l < "$DONE")"
      echo "Failed: $(wc -l < "$FAILED")"
      echo "Conflicts: $(wc -l < "$CONFLICT")"
      echo ""
      echo "Next 5 specs in queue:"
      head -5 "$QUEUE"
    timeout: 30000

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: LOOP — Process specs sequentially
  # ═══════════════════════════════════════════════════════════════

  - id: spec-loop
    depends_on: [init-queue]
    loop:
      prompt: |
        You are an autonomous spec implementation agent. Process the NEXT spec in the queue.

        ## CRITICAL RULES

        1. **Always use the `write` tool** to create files — NEVER use `cat > file << EOF` heredoc
        2. **Always target LuisErlacher/Archon** in gh commands — NEVER upstream (coleam00/Archon)
        3. **Always base new branches on origin/dev** (latest, with previous merges)
        4. **One spec per iteration** — do not try to do multiple specs

        ## Step-by-Step (execute exactly)

        ### Step 1: Check queue
        Run: `cat .archon/loop-state/spec-queue.txt | head -1`

        - If the output is empty → output `<promise>ALL_DONE</promise>` and STOP. Do nothing else.
        - Otherwise the first line is the spec path (e.g. `specs/003-state-machine.md`). Continue.

        ### Step 2: Setup branch
        Let SPEC = first line of queue. Let BRANCH_NAME = `feat/<basename of spec without .md>`.

        Run:
        ```bash
        git fetch origin dev
        git checkout origin/dev -b BRANCH_NAME 2>/dev/null || git checkout BRANCH_NAME
        ```

        ### Step 3: Read spec
        Use the `read` tool to read the SPEC file completely.

        ### Step 4: Check if PR already exists (idempotency)
        Run: `gh pr list --repo LuisErlacher/Archon --head BRANCH_NAME --state all --json number,state`

        If a PR already exists in OPEN or MERGED state, skip implementation and go to Step 7.

        ### Step 5: Implement the spec
        - Create all "Files to Create" using the `write` tool
        - Modify all "Files to Modify" using `edit` or `write` tool
        - Run database migrations if any
        - Run `bun run type-check` to validate (don't fail loop if errors — log them)
        - Run `bun run test` for any new tests (don't fail loop)

        ### Step 6: Commit + push
        ```bash
        git add -A
        git commit -m "feat: implement <spec name>"
        git push -u origin HEAD
        ```

        ### Step 7: Create or update PR
        ```bash
        gh pr create --repo LuisErlacher/Archon --base dev --head BRANCH_NAME \
          --title "feat: <spec title>" \
          --body "Implements specs/<spec name>.md

        ## Files Changed
        $(git diff --stat origin/dev...HEAD)

        🤖 Generated by archon-spec-loop-pi (GLM-5.1)"
        ```

        Save PR number: `PR=$(gh pr list --repo LuisErlacher/Archon --head BRANCH_NAME --json number -q '.[0].number')`

        ### Step 8: Mark ready and merge to dev
        ```bash
        gh pr ready "$PR" --repo LuisErlacher/Archon
        sleep 10
        gh pr merge "$PR" --repo LuisErlacher/Archon --merge --delete-branch
        ```

        - If merge succeeds: append `<spec_name> PR-$PR` to `.archon/loop-state/spec-done.log`
        - If merge fails (conflict): append `<spec_name> PR-$PR conflict` to `.archon/loop-state/spec-conflict.log`

        ### Step 9: Pop queue
        ```bash
        sed -i '1d' .archon/loop-state/spec-queue.txt
        REMAINING=$(wc -l < .archon/loop-state/spec-queue.txt)
        echo "Spec done. $REMAINING specs remaining."
        ```

        ### Step 10: Signal continuation
        - If REMAINING > 0 → output `<promise>NEXT_SPEC</promise>`
        - If REMAINING == 0 → output `<promise>ALL_DONE</promise>`

        ## Error Handling

        If ANY step fails for the current spec:
        - Log the error to `.archon/loop-state/spec-failed.log` with format `<spec_name> <step> <error>`
        - Pop the spec from the queue (Step 9)
        - Continue to next iteration with `<promise>NEXT_SPEC</promise>` (do not block the loop)

        Never stop the loop on a single spec failure — always pop and continue.
      until: ALL_DONE
      max_iterations: 30
      fresh_context: true
      until_bash: |
        # Exit loop early if queue file is empty
        QUEUE=.archon/loop-state/spec-queue.txt
        if [[ ! -s "$QUEUE" ]]; then
          echo "Queue empty — exiting loop"
          exit 0
        fi
        exit 1

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: REPORT — Final summary
  # ═══════════════════════════════════════════════════════════════

  - id: final-report
    depends_on: [spec-loop]
    bash: |
      DONE=.archon/loop-state/spec-done.log
      FAILED=.archon/loop-state/spec-failed.log
      CONFLICT=.archon/loop-state/spec-conflict.log

      echo "════════════════════════════════════════════════════════════"
      echo "SPEC LOOP COMPLETE"
      echo "════════════════════════════════════════════════════════════"
      echo ""
      echo "✅ Done ($(wc -l < "$DONE")):"
      cat "$DONE" 2>/dev/null
      echo ""
      echo "❌ Failed ($(wc -l < "$FAILED")):"
      cat "$FAILED" 2>/dev/null
      echo ""
      echo "⚠️  Conflicts ($(wc -l < "$CONFLICT")):"
      cat "$CONFLICT" 2>/dev/null
      echo ""
      echo "════════════════════════════════════════════════════════════"
    timeout: 30000
