                - paragraph [ref=e369]: "Fix issue #5 - Implement hybrid workflow storage: DB + filesystem. Workflows created via Web UI are stored in database, while filesystem-based workflows (defaults + repo-specific YAML) continue working as-is. Both sources merge in discovery. Key implementation: 1. New migration: CREATE TABLE remote_agent_workflow_definitions (id TEXT PRIMARY KEY, name TEXT UNIQUE NOT NULL, description TEXT, definition TEXT NOT NULL -- JSON of parsed DAG structure, source TEXT NOT NULL DEFAULT 'user' -- 'user'|'imported', codebase_id TEXT -- nullable for global, created_at TEXT NOT NULL, updated_at TEXT NOT NULL). Support both SQLite and PostgreSQL using existing adapter pattern. 2. Add to SQLite init schema (packages/core/src/db/adapters/sqlite.ts) and PostgreSQL migration file. 3. Create DB operations in packages/core/src/db/workflow-definitions.ts: createWorkflowDefinition, getWorkflowDefinition, listWorkflowDefinitions, updateWorkflowDefinition, deleteWorkflowDefinition. 4. Refactor workflow-discovery.ts: add new discovery layer that queries DB AFTER filesystem layers. Merge order: bundled < global < repo-specific < DB (DB workflows with same name override filesystem). Add discoverDbWorkflows() function. 5. Update API routes in packages/server/src/routes/api.ts: Change PUT /api/workflows/:name to save to DB instead of filesystem. Change DELETE to remove from DB. GET continues merging both sources. Add POST /api/workflows/import (YAML text -> parse -> validate -> save to DB). 6. Add Zod schemas in packages/server/src/routes/schemas/workflow.schemas.ts for the new endpoints. 7. Workflow builder (packages/web/) already saves via PUT API - it will automatically use DB storage after backend change. 8. Add export endpoint: GET /api/workflows/:name/export -> returns YAML text for download. IMPORTANT: Do NOT remove filesystem workflow support. This is ADDITIVE. The IWorkflowStore interface is for workflow RUNS (execution state), not definitions - don't confuse them. Follow CLAUDE.md strictly. Run bun run validate."
