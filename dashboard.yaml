                  - /url: /workflows/runs/d49653b39d2f09683122f259744e3955
                - paragraph [ref=e389]: "Fix issue #4 - Add PiAiProvider implementing IAssistantClient using @mariozechner/pi-ai and @mariozechner/pi-agent-core (published on npm v0.66.1). This adds 15+ LLM providers (Anthropic, OpenAI, Google, Mistral, Bedrock, Vertex, Groq, xAI, Ollama, vLLM) via unified interface. Key implementation: 1. Install: bun add @mariozechner/pi-ai @mariozechner/pi-agent-core 2. Create PiAiProvider in packages/core/src/clients/pi-ai.ts implementing IAssistantClient 3. Map pi-agent-core EventStream<AgentEvent> to AsyncGenerator<MessageChunk> (the Archon streaming format) 4. Implement 7 tools as AgentTool<TParameters> with TypeBox schemas: read, edit, write, bash, grep, find, ls - using the existing BashOperations pluggable interface from pi-agent-core 5. Register in factory.ts switch: case 'pi-ai' => PiAiProvider 6. Config schema in .archon/config.yaml: assistants.pi-ai.provider (anthropic/openai/google/etc), assistants.pi-ai.model 7. Workflow support: provider: pi-ai in YAML nodes with model validation at load time 8. Tests mirroring claude.test.ts patterns with mock.module isolation IMPORTANT: pi-ai runs IN-PROCESS (library), not as subprocess like Claude/Codex SDKs. The Agent class from pi-agent-core provides: Agent.prompt(), subscribe() for events, beforeToolCall/afterToolCall hooks, convertToLlm for message bridging. Use Agent class for high-level API. The IAssistantClient interface requires: sendQuery(prompt, cwd, resumeSessionId?, options?) returning AsyncGenerator<MessageChunk> and getType() returning string. MessageChunk types: assistant, system, thinking, result, rate_limit, tool, tool_result, workflow_dispatch. Follow CLAUDE.md strictly. Run bun run validate before creating PR."
