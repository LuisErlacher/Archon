# deploy/nginx.conf
# Nginx reverse proxy for Archon — alternative to Caddyfile.example
#
# Usage options:
#   A) System nginx (on VPS, nginx installed directly):
#      sudo cp deploy/nginx.conf /etc/nginx/sites-available/archon
#      sudo ln -s /etc/nginx/sites-available/archon /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo nginx -s reload
#
#   B) Docker nginx service (add to docker-compose.override.yml):
#      services:
#        nginx:
#          image: nginx:alpine
#          ports: ["80:80"]
#          volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
#          networks: [archon-network]
#          depends_on: { app: { condition: service_healthy } }
#
# Note: For HTTPS + automatic TLS, use --profile cloud (Caddy) instead.
# Caddy handles cert provisioning automatically; nginx requires manual cert setup.

upstream archon_app {
    # Port must match PORT in .env (default: 3000)
    server app:3000;  # Docker: service name. System nginx: 127.0.0.1:3000
}

server {
    listen 80;
    server_name _;  # Replace with your domain (e.g., archon.example.com)

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Webhooks — public, no auth
    location /webhooks/ {
        proxy_pass http://archon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check — public, no auth
    location /api/health {
        proxy_pass http://archon_app;
        proxy_set_header Host $host;
    }

    # SSE streaming endpoint — requires no-buffer proxy settings
    location /api/stream/ {
        proxy_pass http://archon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-specific: disable buffering so events reach the client immediately
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # Extend timeout — default 60s kills SSE connections with no data
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # All other requests (API + Web UI)
    location / {
        proxy_pass http://archon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
