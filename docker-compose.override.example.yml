# Docker Compose override for user-extended builds (development / local Docker).
# Copy this file to docker-compose.override.yml — do NOT modify docker-compose.override.example.yml.
# docker-compose.override.yml is gitignored so your customizations stay local.
#
# Docker Compose automatically merges docker-compose.override.yml with docker-compose.yml
# when both files are present — no extra flags needed:
#   docker compose up -d
#
# NOTE: The base docker-compose.yml uses `build: .` (Dockerfile by default). This override
# switches it to Dockerfile.user so Compose builds your custom image instead.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.user

# ---------------------------------------------------------------------------
# ALTERNATIVE: Development hot-reload (source mounts, no Dockerfile.user)
# ---------------------------------------------------------------------------
# To use: overwrite with this content (instead of the Dockerfile.user block above)
#
# services:
#   app:
#     build:
#       context: .
#       target: deps           # Stop at Stage 1 (skip web-build + production)
#     command: bun run dev:server
#     volumes:
#       - .:/app               # Mount full source for hot-reload
#       - /app/node_modules    # Exclude node_modules (installed in image)
#     environment:
#       WEB_UI_DEV: "true"     # Tells server to skip serveStatic (use vite dev server)
#     ports:
#       - "5173:5173"          # Vite dev server
#     # NOTE: Run Vite dev server on the host (not in Docker):
#     #   bun run dev:web    # Frontend connects to Docker backend on port 3000
