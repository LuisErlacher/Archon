            - row [ref=e1625]:
              - cell [ref=e1626]
              - cell [ref=e1628]:
                - link "archon-idea-to-pr" [ref=e1629] [cursor=pointer]:
                  - /url: /workflows/runs/34353bad590c84f9aeebe24399794173
                - paragraph [ref=e1630]: "Implement a Quality Gate Engine and Node State Store to create a trust boundary between AI agents and workflow state. The core problem: agents can corrupt workflow state by hallucinating (faking test completion, returning malformed JSON, saying COMPLETE without doing work). The solution has 6 components: 1. QUALITY GATE ENGINE (packages/workflows/src/gates/): - New QualityGate interface with: id, name, verify function, severity (p0/p1/p2), maxRetries - GateResult with evidence (stdout, exitCode, parsedResults with passed/failed/skipped counts) - Built-in gate types: test-suite (parses vitest/jest output), typecheck (bun run type-check), lint (bun run lint) - P0/P1 gates BLOCK progression. P2 gates warn but allow continuation. - Gate engine executes commands ITSELF (not trusting agent claims) - Test result parser that counts actual passed/failed/skipped from stdout 2. NODE STATE STORE (new DB table + refactor): - New table remote_agent_node_states: id, workflow_run_id, node_id, status (pending/running/completed/failed/skipped), output (validated), output_validated boolean, gate_results JSON, attempt_count, timestamps - New table remote_agent_test_results: id, node_state_id, suite_name, total, passed, failed, skipped, failures JSON, stdout, exit_code - Refactor dag-executor.ts to persist node state in this table instead of only emitting events - Resume reads from node_states (explicit validated state) instead of re-parsing events 3. OUTPUT VALIDATION LAYER (in dag-executor.ts): - After capturing agent output, validate against output_format schema using Zod - If output_format is set and agent returns non-JSON: FAIL the node (not warning-only like today for Codex) - If JSON parses but schema validation fails: FAIL the node with specific error - Only store validated output in node_states table - Fix silent empty-string substitution in substituteNodeOutputRefs - throw on parse failure instead 4. LOOP GATES (new field in loop node schema): - Add optional gates field to loop node schema in packages/workflows/src/schemas/dag-node.ts - When agent signals completion (COMPLETE), gates run BEFORE accepting the signal - If any p0 gate fails: reject completion, inject gate feedback into next iteration prompt - After maxRetries gate failures: escalate to human with real evidence (test stdout) - Existing until_bash continues to work but gates are the recommended approach 5. API ENDPOINTS (packages/server/src/routes/): - POST /api/workflow-runs/:runId/nodes/:nodeId/complete - validate and store output - POST /api/workflow-runs/:runId/nodes/:nodeId/gate-result - store gate evidence - GET /api/workflow-runs/:runId/summary - aggregate node states + gates + test results - These are called internally by the gate engine and consumed by the dashboard 6. WORKFLOW EVENT IMPROVEMENTS: - New SSE event types: gate_started, gate_passed, gate_failed, gate_blocked - node_completed events now include gate_results array - Dashboard can show real test results per node, not just agent claims IMPORTANT CONSTRAINTS: - Follow CLAUDE.md strictly: Zod schemas, strict TypeScript, no any types - Workflows stay in YAML (filesystem) - this is about execution STATE not definitions - Commands stay in .archon/commands/ - unchanged - Claude Code SDK / Codex SDK unchanged - All new code needs tests (mock.module isolation rules apply) - Run bun run validate before creating PR - Use existing patterns: IWorkflowStore interface, WorkflowDeps injection, event-emitter pattern - Database must support both SQLite and PostgreSQL (use existing adapter pattern)"
