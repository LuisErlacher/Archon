                  - /url: /workflows/runs/832f7414d75821524eeccd36979e3d0a
                - paragraph [ref=e1570]: "Fix issue #6 - Add multi-user authentication with JWT and project-level scoping. Minimal auth system: login/password, JWT tokens, users assigned to projects. Key implementation: 1. New migration tables (both SQLite and PostgreSQL): - remote_agent_users (id TEXT PRIMARY KEY, username TEXT UNIQUE NOT NULL, password_hash TEXT NOT NULL, display_name TEXT, role TEXT NOT NULL DEFAULT 'user' -- 'admin'|'user', created_at TEXT NOT NULL, updated_at TEXT NOT NULL) - remote_agent_project_members (user_id TEXT NOT NULL, codebase_id TEXT NOT NULL, role TEXT NOT NULL DEFAULT 'member' -- 'owner'|'member', PRIMARY KEY (user_id, codebase_id)) 2. Auth utilities in packages/core/src/auth/: - password.ts: hashPassword(plain) using Bun's built-in bcrypt (Bun.password.hash/verify), verifyPassword(plain, hash) - jwt.ts: generateToken(userId, role), verifyToken(token), refreshToken(token). Use jose library for JWT. Access token: 1h expiry. Refresh token: 7d. - middleware.ts: Hono middleware that extracts Bearer token, verifies, sets c.set('userId', ...). Skip auth for: /api/health, /api/auth/login, /api/auth/register, /webhooks/* 3. Auth routes in packages/server/src/routes/auth.ts: - POST /api/auth/register (username, password, displayName) -> { user, accessToken, refreshToken } - POST /api/auth/login (username, password) -> { user, accessToken, refreshToken } - POST /api/auth/refresh (refreshToken) -> { accessToken, refreshToken } - GET /api/auth/me -> current user info - First registered user auto-gets 'admin' role 4. Project scoping: - Add user_id column to remote_agent_conversations table - API queries filter by user's project memberships (JOIN project_members) - Admin can see all projects - Codebase creation auto-adds creator as owner 5. Web UI changes (packages/web/): - Login page at /login route - Auth context provider (React context with token storage in localStorage) - API client adds Authorization header - Redirect to /login if 401 - User menu in top bar (username, logout) 6. CLI support: - archon login command (prompts username/password, stores token in ~/.archon/auth.json) - CLI commands send Authorization header to server IMPORTANT: Do NOT scope every single table by user_id. Scope by project membership (user has access to projects, projects have codebases/conversations/workflows). API keys for LLM providers stay at server level (shared). Follow CLAUDE.md strictly. Use Bun.password for hashing (built-in, no external bcrypt needed). Run bun run validate."
